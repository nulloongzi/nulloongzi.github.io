<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>누룽지 랠리 — 룩 시안 (톤 셰이딩 + POV 손 + 타이포)</title>
<style>
  :root {
    --yellow: #fac710; --gold: #c9971c; --brown: #8d6e63;
    --dark: #4e342e; --cream: #fff8e1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, "Apple SD Gothic Neo", sans-serif;
    background: var(--cream); overflow: hidden; width: 100vw; height: 100vh;
  }
  #stage { position: fixed; inset: 0; z-index: 0; }

  /* 스피드라인 (스파이크) */
  #speedlines { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0.55; }

  /* POV 손 오버레이 */
  .hand { position: fixed; z-index: 3; pointer-events: none; opacity: 0.72; }
  #hand-reach { left: -9vw; top: 38vh; width: 30vw; transform: rotate(22deg); }
  #hand-fist { right: -8vw; bottom: -8vh; width: 48vw; transform: rotate(-10deg); }
  #hand-tossL { left: -5vw; bottom: 0vh; width: 56vw; transform: rotate(8deg) scaleX(-1); }
  #hand-tossR { right: -5vw; bottom: 0vh; width: 56vw; transform: rotate(-8deg); }

  /* 장면 결합 타이포그래피 (박스 없음) */
  .typo {
    position: fixed; z-index: 4; left: 7vw; right: 7vw; pointer-events: none;
    word-break: keep-all;
    text-shadow: 0 2px 18px rgba(255,248,225,.95), 0 0 40px rgba(255,248,225,.8);
  }
  .typo.bottom { bottom: 9vh; }
  .typo.top { top: 8vh; }
  .typo.middle { top: 54vh; }
  .typo .q {
    font-size: .95rem; font-weight: 700; color: var(--brown);
    letter-spacing: .02em; margin-bottom: 12px;
  }
  .typo .q::before { content: "Q. "; color: var(--gold); font-weight: 800; }
  .typo .line {
    font-size: clamp(1.5rem, 6vw, 2.6rem); font-weight: 700;
    color: var(--dark); line-height: 1.35;
  }
  .typo .hit {
    display: block; margin-top: 6px;
    font-size: clamp(2.2rem, 9.5vw, 4.2rem); font-weight: 800;
    color: var(--gold); letter-spacing: -0.01em; line-height: 1.2;
  }
</style>
</head>
<body>

<div id="stage"></div>

<!-- 스피드라인: 방사형 집중선 (가장자리→중심, 중심은 비움) -->
<svg id="speedlines" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" style="display:none">
  <g id="sl" fill="#4e342e"></g>
</svg>

<!-- 사람 손 정의: 오른손, 손등 뷰, 손가락 위 (중지 최장, 끝으로 갈수록 가늘어짐) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="open-hand" fill="#fffdf6" stroke="#4e342e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <!-- 팔뚝 (약간 테이퍼) -->
      <path d="M86 320 L 90 236 C 91 228, 133 228, 134 236 L 140 320 Z"/>
      <!-- 손바닥 -->
      <path d="M68 168 C 68 134 82 120 112 120 C 142 120 156 134 156 166 C 156 200 142 220 112 220 C 84 220 68 202 68 168 Z"/>
      <!-- 검지 -->
      <path transform="rotate(-7 92 90)" d="M84 130 C 81 104 80 74 84 56 C 86 44 99 44 101 56 C 104 76 103 104 100 130 Z"/>
      <!-- 중지 (최장) -->
      <path transform="rotate(-1 113 84)" d="M105 126 C 103 98 103 62 106 42 C 108 30 121 30 123 42 C 126 64 125 100 122 126 Z"/>
      <!-- 약지 -->
      <path transform="rotate(5 133 92)" d="M126 128 C 124 104 124 74 127 56 C 129 45 141 45 143 56 C 146 76 145 104 142 128 Z"/>
      <!-- 소지 (짧고 가늘게) -->
      <path transform="rotate(12 150 106)" d="M145 134 C 143 116 143 94 145 80 C 147 70 157 70 159 80 C 161 96 160 118 158 134 Z"/>
      <!-- 엄지 (손바닥 옆면에서 사선으로) -->
      <path d="M72 178 C 58 168 42 152 34 136 C 28 124 38 112 49 118 C 63 127 74 144 80 160 C 82 168 78 176 72 178 Z"/>
      <!-- 관절 크리즈 힌트 -->
      <path d="M88 152 C 104 160 124 160 142 152" fill="none" stroke-width="3" opacity="0.45"/>
    </g>
    <!-- 토스 손: 손등 뷰, 손가락 활짝 벌려 공을 향함 (오른손 기준, 엄지 안쪽) -->
    <g id="spread-hand" fill="#fffdf6" stroke="#4e342e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <!-- 팔뚝 -->
      <path d="M150 380 C 148 338, 149 312, 153 297 L 205 300 C 209 314, 209 342, 207 380 Z"/>
      <!-- 손등: 너클에서 넓고 손목으로 좁아짐 -->
      <path d="M126 218 L 234 212 C 238 246, 226 284, 206 300 C 186 314, 164 312, 152 299 C 136 284, 126 252, 126 218 Z"/>
      <!-- 검지 (안쪽으로 살짝 굽음) -->
      <path transform="rotate(-19 140 216)" d="M129 216 C 126 176 127 120 133 82 C 135 68 152 68 155 82 C 160 122 158 178 153 216 Z"/>
      <!-- 중지 (최장) -->
      <path transform="rotate(-4 172 214)" d="M161 214 C 158 170 159 106 164 62 C 166 48 183 48 185 62 C 190 108 188 172 184 214 Z"/>
      <!-- 약지 -->
      <path transform="rotate(9 202 213)" d="M192 213 C 189 174 190 118 195 78 C 197 65 212 65 214 78 C 218 120 216 176 212 213 Z"/>
      <!-- 소지 (짧고 가늘게, 더 벌어짐) -->
      <path transform="rotate(24 228 214)" d="M221 214 C 218 184 219 148 223 120 C 225 109 237 109 239 120 C 242 150 240 186 237 214 Z"/>
      <!-- 엄지: 안쪽(공 쪽)으로 뻗음 -->
      <path d="M130 254 C 110 238 92 212 86 190 C 82 174 96 164 108 174 C 124 190 136 216 142 240 C 144 250 138 258 130 254 Z"/>
      <!-- 너클 볼록선 4개 -->
      <path d="M132 212 q 7 -8 15 -2 M163 208 q 8 -8 16 -2 M195 206 q 8 -7 15 -2 M223 208 q 6 -6 12 -1" fill="none" stroke-width="3.5" opacity="0.5"/>
      <!-- 손가락 관절 크리즈 (PIP) -->
      <path d="M133 148 q 9 -4 18 0 M164 132 q 10 -4 19 0 M196 142 q 9 -4 17 0 M224 164 q 7 -3 13 0" fill="none" stroke-width="3" opacity="0.4"/>
      <!-- 손등 힘줄 힌트 -->
      <path d="M146 226 C 154 254 162 280 170 296 M198 222 C 196 250 192 276 186 296" fill="none" stroke-width="2.5" opacity="0.3"/>
    </g>
    <!-- 주먹: 말린 네 손가락 + 감싼 엄지, 측후면 뷰 -->
    <g id="fist-hand" fill="#fffdf6" stroke="#4e342e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <!-- 팔뚝 -->
      <path d="M150 300 L 128 210 C 124 196, 196 178, 202 192 L 232 272 Z" transform="rotate(-6 180 240)"/>
      <!-- 손등/주먹 몸통 -->
      <path d="M78 118 C 74 92 92 70 122 64 C 156 58 186 70 192 96 C 198 122 190 152 168 166 C 140 182 96 176 84 152 C 79 142 80 130 78 118 Z"/>
      <!-- 말린 손가락 4개 (첫마디 능선) -->
      <path d="M84 116 C 82 100 90 90 100 92 C 108 94 110 104 108 118 C 106 128 88 128 84 116 Z"/>
      <path d="M110 106 C 108 90 118 80 128 82 C 136 84 139 96 137 110 C 135 122 113 120 110 106 Z"/>
      <path d="M139 102 C 138 88 148 78 158 82 C 165 85 168 96 166 108 C 164 120 142 116 139 102 Z"/>
      <path d="M167 104 C 167 92 175 84 183 88 C 189 91 191 100 189 110 C 187 120 169 116 167 104 Z"/>
      <!-- 엄지: 아래를 사선으로 감쌈 -->
      <path d="M86 148 C 96 160 118 168 138 166 C 148 165 150 176 141 180 C 118 188 92 178 80 162 C 74 154 79 144 86 148 Z"/>
    </g>
  </defs>
</svg>

<!-- POV 손: 뻗은 손 (스파이크 - 조준) -->
<svg id="hand-reach" class="hand" viewBox="0 0 226 320" style="display:none"><use href="#open-hand"/></svg>

<!-- POV 손: 당긴 주먹 (스파이크 - 도움닫기) -->
<svg id="hand-fist" class="hand" viewBox="0 0 260 300" style="display:none"><use href="#fist-hand"/></svg>

<!-- POV 손: 토스 (양손, 손가락 활짝 벌려 공을 향함) -->
<svg id="hand-tossL" class="hand" viewBox="0 0 280 380" style="display:none"><use href="#spread-hand"/></svg>
<svg id="hand-tossR" class="hand" viewBox="0 0 280 380" style="display:none"><use href="#spread-hand"/></svg>

<!-- POV 서브 홀드: 왼손 위 컵 모양 손 (공을 앞으로 들고 있음, 토스 직전) -->
<svg id="cup-hand" viewBox="0 0 300 300" style="display:none; position:fixed; z-index:3; left:49%; bottom:5.5vh; width:min(62vw,290px); transform:translateX(-50%) rotate(-3deg); pointer-events:none; opacity:.78">
  <g fill="#fffdf6" stroke="#4e342e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 팔뚝 (아래에서 진입) -->
    <path d="M118 300 C 120 268, 124 246, 128 234 L 176 236 C 179 250, 181 272, 182 300 Z"/>
    <!-- 손바닥: 위로 벌린 얕은 컵 -->
    <path d="M90 204 C 94 184, 118 170, 150 168 C 186 166, 212 178, 216 198 C 218 212, 208 224, 188 228 C 158 233, 116 232, 100 222 C 92 217, 88 211, 90 204 Z"/>
    <!-- 엄지 (왼쪽에서 올라옴) -->
    <path d="M94 202 C 82 190, 74 174, 76 158 C 78 146, 92 146, 96 158 C 101 172, 104 188, 106 200 Z"/>
    <!-- 손가락 끝 4개 (오른쪽 림 위로 살짝) -->
    <path transform="rotate(-8 172 158)" d="M164 178 C 163 164, 165 150, 169 142 C 172 135, 181 136, 182 144 C 184 156, 183 170, 181 180 Z"/>
    <path transform="rotate(-2 194 156)" d="M187 176 C 186 160, 188 146, 192 138 C 195 131, 204 132, 205 140 C 206 152, 205 166, 203 178 Z"/>
    <path transform="rotate(6 214 160)" d="M208 178 C 207 164, 209 152, 213 144 C 216 138, 224 139, 225 146 C 226 158, 224 170, 222 180 Z"/>
    <path transform="rotate(14 230 170)" d="M226 186 C 225 175, 226 165, 229 158 C 232 152, 239 153, 240 160 C 240 170, 238 180, 236 188 Z"/>
    <!-- 손바닥 크리즈 -->
    <path d="M108 214 C 132 222 168 222 194 214" fill="none" stroke-width="3" opacity="0.4"/>
  </g>
</svg>

<!-- 타이포: 서브 홀드 -->
<div class="typo top" id="typo-servehold" style="display:none">
  <div class="q">배구, 어떻게 시작했어요?</div>
  <div class="line">고3 수행평가였어요.<br>그때 하이큐를 처음 봤고 —</div>
</div>

<!-- POV 리시브: 모인 팔뚝 플랫폼 (연출상 실제보다 높게 프레임 인) -->
<svg id="platform" viewBox="0 0 300 420" style="display:none; position:fixed; z-index:3; left:55%; bottom:8vh; width:min(64vw,300px); transform:translateX(-50%) rotate(-12deg); pointer-events:none; opacity:.8">
  <g fill="#fffdf6" stroke="#4e342e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 왼 팔뚝 (아래=가까움=굵게, 위=멀어짐=가늘게) -->
    <path d="M78 420 C 82 350, 96 270, 116 212 C 122 196, 146 198, 146 214 C 138 276, 132 352, 132 420 Z"/>
    <!-- 오른 팔뚝 -->
    <path d="M222 420 C 218 350, 206 270, 188 212 C 182 196, 158 198, 158 214 C 164 276, 168 352, 168 420 Z"/>
    <!-- 맞잡은 손 (겹친 주먹 + 엄지 두 개) -->
    <path d="M112 210 C 104 184, 118 162, 146 158 C 176 154, 196 170, 194 194 C 192 214, 176 226, 150 226 C 128 226, 116 220, 112 210 Z"/>
    <path d="M132 168 C 130 154, 136 144, 146 142 C 154 141, 160 148, 158 160 Z"/>
    <path d="M156 164 C 156 150, 164 141, 172 142 C 180 144, 183 152, 180 164 Z"/>
    <!-- 손목 크리즈 -->
    <path d="M120 216 q 16 8 34 6 M160 222 q 16 -2 30 -10" fill="none" stroke-width="3" opacity="0.4"/>
  </g>
</svg>

<!-- 타이포: 리시브 -->
<div class="typo top" id="typo-receive" style="display:none">
  <div class="q">이 판에서 받은 것 중 제일 기억에 남는 건?</div>
  <div class="line">제가 받은 환대는 플레이가 아니라</div>
  <span class="hit">밥상에서 왔어요.</span>
</div>

<!-- 측면 실루엣 컷: 점프 서브 아치 (니시다 레퍼런스) -->
<svg id="silhouette" viewBox="0 0 400 420" style="display:none; position:fixed; z-index:3; left:50%; top:44%; width:min(72vw,340px); transform:translate(-50%,-50%); pointer-events:none">
  <g fill="#4e342e" transform="rotate(-12 200 220)">
    <circle cx="170" cy="86" r="27"/>                                      <!-- 머리 (뒤로 젖힘) -->
    <path d="M165 108 C 138 140, 140 200, 190 248 C 204 258, 224 252, 226 240 C 210 205, 208 150, 210 116 C 196 104, 176 100, 165 108 Z"/> <!-- 활처럼 휜 몸통 -->
    <path d="M192 132 C 218 116, 246 104, 260 100 C 272 97, 276 110, 266 116 C 248 124, 220 134, 200 144 Z"/>  <!-- 상완: 어깨→팔꿈치(높이) -->
    <path d="M252 112 C 250 92, 240 70, 224 56 C 214 48, 204 58, 212 68 C 226 80, 240 96, 248 112 Z"/>          <!-- 전완: 팔꿈치→머리 뒤 손 -->
    <path d="M170 126 C 142 108, 114 88, 100 72 C 92 62, 102 52, 112 60 C 130 74, 154 94, 176 110 Z"/>          <!-- 앞팔: 앞위로 뻗음 -->
    <path d="M198 240 C 226 252, 252 272, 266 288 C 274 298, 264 310, 254 302 C 234 286, 210 266, 192 252 Z"/>  <!-- 뒷다리 허벅지 -->
    <path d="M254 290 C 270 308, 284 332, 290 352 C 293 364, 279 368, 274 356 C 266 338, 254 316, 246 300 Z"/>  <!-- 뒷다리 종아리 (접힘) -->
    <path d="M184 246 C 206 268, 226 294, 238 314 C 244 326, 232 334, 224 324 C 208 304, 190 280, 174 260 Z"/>  <!-- 앞다리 허벅지 -->
    <path d="M230 314 C 240 334, 246 356, 248 372 C 249 384, 235 386, 232 374 C 228 356, 222 336, 216 322 Z"/>  <!-- 앞다리 종아리 -->
  </g>
</svg>

<!-- 측면 컷용 수평 스피드라인 -->
<svg id="hlines" viewBox="0 0 100 100" preserveAspectRatio="none" style="display:none; position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.4">
  <g fill="#4e342e" id="hl"></g>
</svg>

<!-- 타이포: 서브 실루엣 컷 -->
<div class="typo bottom" id="typo-serve" style="display:none">
  <div class="q">배구, 어떻게 시작했어요?</div>
  <div class="line">만화처럼은 아니어도,</div>
  <span class="hit">친구들이랑 배구를<br>할 수 있다는 것.</span>
</div>

<!-- 타이포: 스파이크 -->
<div class="typo middle" id="typo-spike" style="display:none">
  <div class="q">한국 배구판에 하고 싶은 말은?</div>
  <div class="line">배구도 그랬으면 좋겠어요.</div>
  <span class="hit">언제 어디서든.</span>
</div>

<!-- 타이포: 토스 -->
<div class="typo top" id="typo-toss" style="display:none">
  <div class="q">그런데 왜 지도까지 만들었어요?</div>
  <div class="line">그 DM에 하나하나 답하다가 —</div>
  <span class="hit">아, 지도를 만들어야겠다.</span>
</div>

<script type="importmap">
{ "imports": { "three": "./assets/vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OutlineEffect } from './assets/vendor/OutlineEffect.js';

var SCENE = new URLSearchParams(location.search).get('scene') || 'spike';

var COL = {
  cream: 0xfff8e1, wall: 0xf3e2b8, window: 0xfffbe8,
  wood: 0xcfa672, zoneBack: 0xfde1a0, zoneFront: 0xf6b83d,
  line: 0xffffff, dark: 0x4e342e, brown: 0x8d6e63, yellow: 0xfac710, urgent: 0xff7043
};

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('stage').appendChild(renderer.domElement);

var effect = new OutlineEffect(renderer, { defaultThickness: 0.004, defaultColor: [0.24, 0.16, 0.13] });

var scene = new THREE.Scene();
scene.background = new THREE.Color(COL.cream);

var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 120);

// ── 조명 (톤 셰이딩용: 방향 하나 + 넉넉한 환경광) ──
scene.add(new THREE.AmbientLight(0xfff4d6, 1.6));
var sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(8, 14, 6);
scene.add(sun);

// ── 3단계 그라디언트 맵 (셀 밴드) ──
var gCanvas = document.createElement('canvas');
gCanvas.width = 4; gCanvas.height = 1;
var gc = gCanvas.getContext('2d');
[100, 160, 235, 255].forEach(function (v, i) { gc.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')'; gc.fillRect(i, 0, 1, 1); });
var gradientMap = new THREE.CanvasTexture(gCanvas);
gradientMap.minFilter = THREE.NearestFilter;
gradientMap.magFilter = THREE.NearestFilter;

function tmat(color, opts) {
  var m = new THREE.MeshToonMaterial(Object.assign({ color: color, gradientMap: gradientMap }, opts || {}));
  return m;
}

// ── 체육관: 벽 + 창 + 천장 ──
var backWall = new THREE.Mesh(new THREE.PlaneGeometry(80, 14), tmat(COL.wall));
backWall.position.set(0, 7, -24);
scene.add(backWall);
for (var wi = 0; wi < 4; wi++) {
  var win = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.6), new THREE.MeshBasicMaterial({ color: COL.window }));
  win.position.set(-15 + wi * 10, 8.6, -23.9);
  scene.add(win);
}
var sideWall = new THREE.Mesh(new THREE.PlaneGeometry(60, 14), tmat(0xefdcb0));
sideWall.rotation.y = -Math.PI / 2;
sideWall.position.set(14, 7, 0);
scene.add(sideWall);
var ceiling = new THREE.Mesh(new THREE.PlaneGeometry(80, 60), tmat(0xf9efd2));
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = 10.5;
scene.add(ceiling);
for (var bi = 0; bi < 5; bi++) {
  var beam = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 40), tmat(0xd9c08b));
  beam.position.set(-12 + bi * 6, 10.2, -2);
  scene.add(beam);
  // 보 아래 체육관 조명 열 (올려다보는 컷의 드라마)
  for (var li = 0; li < 6; li++) {
    var lamp = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.12, 0.5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    lamp.position.set(-12 + bi * 6, 9.85, -14 + li * 5);
    scene.add(lamp);
    var halo = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.1), new THREE.MeshBasicMaterial({ color: 0xfffbe0, transparent: true, opacity: 0.5 }));
    halo.rotation.x = Math.PI / 2;
    halo.position.set(-12 + bi * 6, 9.78, -14 + li * 5);
    scene.add(halo);
  }
}

// ── 바닥/코트 ──
var wood = new THREE.Mesh(new THREE.PlaneGeometry(80, 60), tmat(COL.wood));
wood.rotation.x = -Math.PI / 2;
scene.add(wood);
function zone(w, d, x, z, c) {
  var m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), tmat(c));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.02, z);
  scene.add(m);
}
zone(9, 6, 0, 6, COL.zoneBack); zone(9, 3, 0, 1.5, COL.zoneFront);
zone(9, 3, 0, -1.5, COL.zoneFront); zone(9, 6, 0, -6, COL.zoneBack);
function cline(w, d, x, z) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.03, d), tmat(COL.line));
  m.position.set(x, 0.035, z);
  scene.add(m);
}
cline(0.12, 18.1, -4.5, 0); cline(0.12, 18.1, 4.5, 0);
cline(9.1, 0.12, 0, 9); cline(9.1, 0.12, 0, -9);
cline(9.1, 0.12, 0, 3); cline(9.1, 0.12, 0, -3); cline(9.1, 0.12, 0, 0);

// ── 네트 ──
[-5.1, 5.1].forEach(function (x) {
  var p = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 2.55, 10), tmat(COL.dark));
  p.position.set(x, 1.275, 0);
  scene.add(p);
});
var band = new THREE.Mesh(new THREE.BoxGeometry(10.2, 0.16, 0.05), tmat(COL.line));
band.position.set(0, 2.42, 0);
scene.add(band);
var meshCanvas = document.createElement('canvas');
meshCanvas.width = 1024; meshCanvas.height = 128;
var mc = meshCanvas.getContext('2d');
mc.strokeStyle = 'rgba(255,253,246,0.85)'; mc.lineWidth = 1.5;
for (var gx = 0; gx <= 1024; gx += 10) { mc.beginPath(); mc.moveTo(gx, 0); mc.lineTo(gx, 128); mc.stroke(); }
for (var gy = 0; gy <= 128; gy += 10) { mc.beginPath(); mc.moveTo(0, gy); mc.lineTo(1024, gy); mc.stroke(); }
var netMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(10.2, 1.0),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(meshCanvas), transparent: true, side: THREE.DoubleSide })
);
netMesh.position.set(0, 1.85, 0);
scene.add(netMesh);
var antCanvas = document.createElement('canvas');
antCanvas.width = 8; antCanvas.height = 64;
var ac = antCanvas.getContext('2d');
for (var s = 0; s < 8; s++) { ac.fillStyle = s % 2 ? '#fffdf6' : '#ff7043'; ac.fillRect(0, s * 8, 8, 8); }
[-4.5, 4.5].forEach(function (x) {
  var a = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.7, 8),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(antCanvas) }));
  a.position.set(x, 2.97, 0);
  scene.add(a);
});

// ── 공 (클래식 스월 + 톤) ──
var ballCanvas = document.createElement('canvas');
ballCanvas.width = 512; ballCanvas.height = 256;
var bc = ballCanvas.getContext('2d');
bc.fillStyle = '#fffdf6'; bc.fillRect(0, 0, 512, 256);
bc.strokeStyle = '#a58974'; bc.lineWidth = 5; bc.lineCap = 'round';
for (var k = 0; k < 4; k++) {
  var ox = k * 128;
  bc.beginPath(); bc.moveTo(ox, 40); bc.bezierCurveTo(ox + 50, 90, ox + 78, 160, ox + 64, 236); bc.stroke();
  bc.beginPath(); bc.moveTo(ox + 64, 20); bc.bezierCurveTo(ox + 110, 70, ox + 120, 150, ox + 128, 210); bc.stroke();
}
var ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.35, 24, 18),
  tmat(0xffffff, { map: new THREE.CanvasTexture(ballCanvas) })
);
scene.add(ball);

// ── 장면 세팅 ──
function show(id) { document.getElementById(id).style.display = 'block'; }

if (SCENE === 'spike') {
  // 스파이커 시점: 공중, 네트 너머 상대 코트를 내려다봄
  camera.position.set(-1.6, 3.5, -2.8);
  camera.lookAt(0.6, -0.2, 9);
  ball.position.set(-0.55, 2.95, 1.2);
  ball.rotation.z = 0.6;
  show('speedlines'); show('hand-reach'); show('hand-fist'); show('typo-spike');
  // 스피드라인 생성
  var sl = document.getElementById('sl');
  for (var i = 0; i < 46; i++) {
    var ang = (i / 46) * Math.PI * 2 + (i % 3) * 0.03;
    var cxr = 50 + Math.cos(ang) * 74, cyr = 50 + Math.sin(ang) * 74;
    var r1 = 26 + (i % 5) * 3.5;
    var x1 = 50 + Math.cos(ang) * r1, y1 = 50 + Math.sin(ang) * r1;
    var wHalf = 0.5 + (i % 4) * 0.28;
    var perp = ang + Math.PI / 2;
    var px = Math.cos(perp) * wHalf, py = Math.sin(perp) * wHalf;
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    p.setAttribute('points',
      (cxr + px) + ',' + (cyr + py) + ' ' + (cxr - px) + ',' + (cyr - py) + ' ' + x1 + ',' + y1);
    p.setAttribute('opacity', String(0.35 + (i % 3) * 0.18));
    sl.appendChild(p);
  }
} else if (SCENE === 'servehold') {
  // 서버 시점: 베이스라인에서 코트를 바라보며 왼손에 공을 들고 있음 (토스 직전)
  camera.position.set(1.5, 1.7, 10.3);
  camera.lookAt(-0.3, 1.7, -4);
  ball.position.set(1.1, 1.2, 7.55);   // 손 바로 위 (릴리즈 순간)
  ball.rotation.z = 0.3;
  show('cup-hand'); show('typo-servehold');
} else if (SCENE === 'receive') {
  // 리시버 시점: 낙하하는 공 + 네트/상대 코트/천장. 플랫폼은 연출상 프레임 안으로
  camera.position.set(-2, 1.7, -6.2);
  camera.lookAt(1.2, 4.2, 8);
  ball.position.set(-0.85, 2.75, -2.7);
  ball.rotation.z = 0.9;
  show('platform'); show('typo-receive');
} else if (SCENE === 'serve') {
  // 측면 실루엣 컷: 점프 서브 아치 (몸의 순간은 3인칭 실루엣)
  camera.position.set(10, 2.9, 16.5);
  camera.lookAt(-7, 2.5, -1);
  ball.position.set(-1.5, 5.4, 8.0);   // 실루엣 손 위쪽의 토스 공
  ball.rotation.z = 0.4;
  show('silhouette'); show('hlines'); show('typo-serve');
  var hl = document.getElementById('hl');
  for (var j = 0; j < 26; j++) {
    var y = 3 + j * 3.8 + (j % 3);
    var len = 18 + (j * 7) % 46;
    var x0 = (j * 37) % (100 - len);
    var hgt = 0.22 + (j % 3) * 0.14;
    var r = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    r.setAttribute('points', x0 + ',' + y + ' ' + (x0 + len) + ',' + (y - hgt / 2) + ' ' + (x0 + len) + ',' + (y + hgt / 2));
    r.setAttribute('opacity', String(0.25 + (j % 4) * 0.12));
    hl.appendChild(r);
  }
} else {
  // 세터 시점: 하늘을 올려다보는 토스
  camera.position.set(0.5, 1.55, -1.0);
  camera.lookAt(-0.4, 6.5, -1.6);
  ball.position.set(-0.15, 3.9, -1.15);
  ball.rotation.z = 1.1;
  show('hand-tossL'); show('hand-tossR'); show('typo-toss');
}

effect.render(scene, camera);
window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  effect.render(scene, camera);
});
</script>
</body>
</html>
